[project]
name = "agentic-system"
version = "0.1.0"
description = "Scalable agentic system with dynamic tool discovery and execution"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # LLM & Agent framework
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",

    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3.0",

    # Vector DB & persistence
    "qdrant-client>=1.11.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",

    # Observability
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-api>=1.25.0",

    # UI & HTTP
    "streamlit>=1.37.0",
    "httpx>=0.27.0",

    # Embeddings fallback
    "sentence-transformers>=3.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
